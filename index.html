    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17894848842"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17894848842', { allow_enhanced_conversions: true });

      // Clicks are recorded as plain events, NOT conversions (a click on "Book" is not a booking).
      document.addEventListener('click', function(e) {
        var link = e.target.closest && e.target.closest('a[href]');
        if (!link) return;
        var href = link.getAttribute('href') || '';
        if (href.indexOf('fieldd') !== -1) {
          gtag('event', 'booking_click', { link_url: link.href, page_location: window.location.pathname });
        } else if (href.indexOf('tel:') === 0) {
          gtag('event', 'click_to_call', { page_location: window.location.pathname });
        }
      });
    </script>
