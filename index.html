<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Car Detailing Calgary | Cars, RVs, Trailers & Fleet</title>
    <meta name="description" content="Calgary's 4.9-star mobile detailing — we come to you. Interior, exterior, ceramic coating, paint correction, RV &amp; fleet. Book or call 587-500-4523." />
    <meta name="author" content="Xpress Auto Detailing" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://xpressauto.fieldd.co" />

    <!-- Open Graph (sitewide fallback; per-route Helmet overrides for JS crawlers) -->
    <meta property="og:title" content="Mobile Car Detailing Calgary | Cars, RVs, Trailers & Fleet" />
    <meta property="og:description" content="Calgary's 4.9-star mobile detailing — we come to you. Interior, exterior, ceramic coating, paint correction, RV oxidation removal and fleet detailing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xpressautodetail.ca/" />
    <meta property="og:image" content="https://xpressautodetail.ca/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mobile Car Detailing Calgary | Cars, RVs, Trailers & Fleet" />
    <meta name="twitter:description" content="Calgary's 4.9-star mobile detailing — we come to you. Interior, exterior, ceramic coating, paint correction, RV oxidation removal and fleet detailing." />

    <!-- Performance: font display swap is already in the CSS import -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17894848842"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17894848842');

      // Track clicks on all fieldd booking links
      document.addEventListener('click', function(e) {
        var link = e.target.closest('a[href*="fieldd"]');
        if (link) {
          // Google Ads conversion
          gtag('event', 'conversion', {
            'send_to': 'AW-17894848842',
            'event_callback': function() {}
          });
          // GA4 custom event for analytics reporting
          gtag('event', 'book_now_click', {
            'event_category': 'engagement',
            'event_label': link.textContent.trim(),
            'link_url': link.href,
            'page_location': window.location.pathname
          });
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
