<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xpress Auto Detailing | Mobile Car Detailing Calgary</title>
    <meta name="description" content="Calgary's #1 mobile car detailing — we come to your home or office. Interior, exterior, ceramic coating & fleet packages. 4.9★ rated. Book online in 60 seconds." />
    <meta name="author" content="Xpress Auto Detailing" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://xpressautodetailing.ca/" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://xpressauto.fieldd.co" />

    <!-- Open Graph -->
    <meta property="og:title" content="Xpress Auto Detailing | Mobile Car Detailing Calgary" />
    <meta property="og:description" content="Calgary's #1 mobile car detailing — we come to your home or office. Book online in 60 seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xpressautodetailing.ca/" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xpress Auto Detailing | Mobile Car Detailing Calgary" />
    <meta name="twitter:description" content="Calgary's #1 mobile car detailing. We come to you — book in 60 seconds." />

    <!-- Performance: font display swap is already in the CSS import -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17894848842"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17894848842');

      // Track clicks on all fieldd booking links
      document.addEventListener('click', function(e) {
        var link = e.target.closest('a[href*="fieldd"]');
        if (link) {
          // Google Ads conversion
          gtag('event', 'conversion', {
            'send_to': 'AW-17894848842',
            'event_callback': function() {}
          });
          // GA4 custom event for analytics reporting
          gtag('event', 'book_now_click', {
            'event_category': 'engagement',
            'event_label': link.textContent.trim(),
            'link_url': link.href,
            'page_location': window.location.pathname
          });
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
